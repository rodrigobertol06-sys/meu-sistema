<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Meu Sistema Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <div class="topo-linha">
            <h1>Meu Sistema</h1>
            <span id="status" class="status"></span>
        </div>
        <label class="cenario-escolha">
            <span>Cenário</span>
            <select id="cenarioAtivo"></select>
        </label>
    </header>

    <nav class="abas" id="abas">
        <button data-aba="painel" class="ativa">Painel</button>
        <button data-aba="renda">Renda &amp; Gastos</button>
        <button data-aba="aquisicoes">Aquisições</button>
        <button data-aba="investimentos">Investimentos</button>
        <button data-aba="carros">Carros</button>
        <button data-aba="mercado">Mercado</button>
        <button data-aba="ajustes">Ajustes</button>
    </nav>

    <main id="conteudo" class="conteudo"></main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
